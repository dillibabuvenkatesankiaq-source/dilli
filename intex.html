<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a class="logo" href="index.html">My College</a>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="index.html">Register</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="form-card">
            <h1>Student Registration</h1>
            <p class="intro">Fill in the details below to register for a course.</p>

            <form action="#" method="post">

                <div class="two-columns">
                    <div>
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text"
                               placeholder="Enter your name" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email"
                               placeholder="Enter your email" required>
                    </div>
                </div>

                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       placeholder="Enter a password" required>

                <label>Gender</label>
                <div class="radio-group">
                    <span class="radio-option">
                        <input class="radio" id="male" name="gender" type="radio" value="male">
                        <label class="radio-label" for="male">Male</label>
                    </span>
                    <span class="radio-option">
                        <input class="radio" id="female" name="gender" type="radio" value="female">
                        <label class="radio-label" for="female">Female</label>
                    </span>
                    <span class="radio-option">
                        <input class="radio" id="other" name="gender" type="radio" value="other">
                        <label class="radio-label" for="other">Other</label>
                    </span>
                </div>

                <label for="course">Choose a course</label>
                <select id="course" name="course" required>
                    <option value="">Select course</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                </select>

                <label for="message">Message</label>
                <textarea id="message" name="message"
                          rows="4" placeholder="Write a message"></textarea>

                <button class="submit-btn" type="submit">Register</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My College. All rights reserved.</p>
    </footer>

</body>
</html>
